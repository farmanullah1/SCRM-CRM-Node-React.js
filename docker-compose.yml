services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./Backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_SERVER: db
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-SCRM}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL}
      BACKEND_URL: ${BACKEND_URL}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASS: ${GMAIL_APP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WA_SESSION_DIR: /app/.wwebjs_auth
      WA_CHROME_PATH: /usr/bin/chromium
      WA_HEADLESS: ${WA_HEADLESS:-true}
      WA_DEFAULT_COUNTRY_CODE: ${WA_DEFAULT_COUNTRY_CODE:-}
      WA_SEND_DELAY_MS: ${WA_SEND_DELAY_MS:-1000}
      WA_SEND_JITTER_MS: ${WA_SEND_JITTER_MS:-500}
      WA_MAX_QUEUE_SIZE: ${WA_MAX_QUEUE_SIZE:-1000}
      WA_WATCHDOG_INTERVAL_MS: ${WA_WATCHDOG_INTERVAL_MS:-60000}
      WA_CAPTURE_GROUPS: ${WA_CAPTURE_GROUPS:-false}
      WA_CAPTURE_NEWSLETTERS: ${WA_CAPTURE_NEWSLETTERS:-false}
    volumes:
      - uploads_data:/app/uploads
      - wa_session:/app/.wwebjs_auth
    shm_size: "1gb"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
  uploads_data:
  wa_session:
