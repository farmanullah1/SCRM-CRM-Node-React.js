<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="scrmMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="50%" stop-color="#222316" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFF69" />
      <stop offset="100%" stop-color="#F0FF60" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with hairline boundary -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#scrmMarkGrad)" stroke="#414141" stroke-width="1.2" />
  <rect x="4" y="4" width="40" height="40" rx="8" stroke="#4F5101" stroke-width="0.8" opacity="0.6" />

  <!-- Continuous Connected Circuit Ribbon forming stylized 'S' -->
  <!-- Top Loop -->
  <path d="M34 14 C34 10.5 30 8.5 24 8.5 C16.5 8.5 13 12.5 13 17 C13 22.5 18 24 24 25.5 C30 27 35 28.5 35 34 C35 39.5 30.5 42.5 24 42.5 C16 42.5 12 38.5 12 34" 
        stroke="url(#accentGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#softGlow)" />

  <!-- Interconnected Relationship Nodes (Lead -> Deal -> Contact stages) -->
  <circle cx="34" cy="14" r="3" fill="#FFFFFF" stroke="#181818" stroke-width="1.5" />
  <circle cx="24" cy="25.5" r="2.5" fill="#F0FF60" stroke="#181818" stroke-width="1.2" />
  <circle cx="12" cy="34" r="3" fill="#FAFF69" stroke="#181818" stroke-width="1.5" />

  <!-- Secondary Bridge Nodes -->
  <circle cx="17" cy="11" r="1.5" fill="#484848" />
  <circle cx="31" cy="40" r="1.5" fill="#484848" />
</svg>

